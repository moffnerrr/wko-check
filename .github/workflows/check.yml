name: WKO Volontariat Check

on:
  schedule:
    - cron: "*/5 * * * *"   # alle 15 Minuten
  workflow_dispatch:          # erlaubt den manuellen Testlauf

permissions:
  contents: write             # damit der neue Stand gespeichert werden kann

concurrency:
  group: wko-check

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Seite prüfen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 check.py

      - name: Neuen Stand speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add last_state.txt
          git diff --cached --quiet || (git commit -m "Stand aktualisiert" && git push)
